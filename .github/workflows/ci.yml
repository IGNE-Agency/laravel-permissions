name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Laravel ${{ matrix.laravel }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
        dependencies: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: vendor/bin/phpunit
